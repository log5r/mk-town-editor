name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and unit tests
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Configure Japanese test locale
        run: |
          defaults write NSGlobalDomain AppleLanguages -array ja en
          defaults write NSGlobalDomain AppleLocale -string ja_JP

      - name: Run unit tests and build Release
        env:
          CI_ARTIFACTS_DIR: ${{ runner.temp }}/ci-results
        run: |
          mkdir -p "$CI_ARTIFACTS_DIR"
          bash Tools/ci.sh 2>&1 | tee "$CI_ARTIFACTS_DIR/ci.log"

      - name: Diagnose PDF test failures
        if: ${{ failure() }}
        run: |
          swift -e 'import PDFKit; import Foundation; for path in ["/private/tmp/mktown-pdf-qa.pdf", "/private/tmp/mktown-cover-qa.pdf"] { if let pdf = PDFDocument(url: URL(fileURLWithPath: path)) { print("PDF:", path, "pages:", pdf.pageCount); print(String((pdf.string ?? "").prefix(1500)).debugDescription) } }'

      - name: Upload CI log
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ci-results
          path: ${{ runner.temp }}/ci-results/
          if-no-files-found: ignore
          retention-days: 7
