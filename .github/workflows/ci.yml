name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 各ジョブは独立して並列に実行する。SwiftPMを使うジョブは、依存リポジトリの
# クローン（キャッシュなしで約3分）を省くため、同じキーのキャッシュを共有する。
# swiftコマンドとxcodebuildはどちらも ~/Library/Caches/org.swift.swiftpm を参照する。
jobs:
  script-tests:
    name: Script tests
    runs-on: xcode-27
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Configure Japanese test locale
        run: |
          defaults write NSGlobalDomain AppleLanguages -array ja en
          defaults write NSGlobalDomain AppleLocale -string ja_JP

      - name: Run Python script tests
        env:
          CI_ARTIFACTS_DIR: ${{ runner.temp }}/ci-results
        run: |
          mkdir -p "$CI_ARTIFACTS_DIR"
          bash Tools/ci.sh python 2>&1 | tee "$CI_ARTIFACTS_DIR/script-tests.log"

      - name: Upload CI log
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ci-results-script-tests
          path: ${{ runner.temp }}/ci-results/
          if-no-files-found: ignore
          retention-days: 7

  unit-tests:
    name: Unit tests
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Configure Japanese test locale
        run: |
          defaults write NSGlobalDomain AppleLanguages -array ja en
          defaults write NSGlobalDomain AppleLocale -string ja_JP

      - name: Cache SwiftPM dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-${{ hashFiles('Package.resolved', 'MKTownEditor.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Run unit tests
        env:
          CI_ARTIFACTS_DIR: ${{ runner.temp }}/ci-results
        run: |
          mkdir -p "$CI_ARTIFACTS_DIR"
          bash Tools/ci.sh test 2>&1 | tee "$CI_ARTIFACTS_DIR/unit-tests.log"

      - name: Diagnose PDF test failures
        if: ${{ failure() }}
        run: |
          swift -e 'import PDFKit; import Foundation; for path in ["/private/tmp/mktown-pdf-qa.pdf", "/private/tmp/mktown-cover-qa.pdf"] { if let pdf = PDFDocument(url: URL(fileURLWithPath: path)) { print("PDF:", path, "pages:", pdf.pageCount); print(String((pdf.string ?? "").prefix(1500)).debugDescription) } }'

      - name: Upload CI log
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ci-results-unit-tests
          path: ${{ runner.temp }}/ci-results/
          if-no-files-found: ignore
          retention-days: 7

  release-build:
    name: Release build
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Cache SwiftPM dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-${{ hashFiles('Package.resolved', 'MKTownEditor.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Build Release
        env:
          CI_ARTIFACTS_DIR: ${{ runner.temp }}/ci-results
        run: |
          mkdir -p "$CI_ARTIFACTS_DIR"
          bash Tools/ci.sh release 2>&1 | tee "$CI_ARTIFACTS_DIR/release-build.log"

      - name: Upload CI log
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ci-results-release-build
          path: ${{ runner.temp }}/ci-results/
          if-no-files-found: ignore
          retention-days: 7

  ios-build:
    name: iOS build
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Cache SwiftPM dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-${{ hashFiles('Package.resolved', 'MKTownEditor.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Compile iOS app and unit tests
        env:
          CI_ARTIFACTS_DIR: ${{ runner.temp }}/ci-results
        run: |
          mkdir -p "$CI_ARTIFACTS_DIR"
          xcodebuild -project MKTownEditor.xcodeproj -scheme MKTownEditorMobile \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/mobile-derived-data" \
            build-for-testing CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$CI_ARTIFACTS_DIR/mobile-build.log"

      - name: Upload CI log
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ci-results-ios-build
          path: ${{ runner.temp }}/ci-results/
          if-no-files-found: ignore
          retention-days: 7
