name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Test, sign, notarize and prepare release
    runs-on: xcode-27
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_BUILD_NUMBER: ${{ github.run_number }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Show toolchain and configure test locale
        run: |
          xcodebuild -version
          swift --version
          defaults write NSGlobalDomain AppleLanguages -array ja en
          defaults write NSGlobalDomain AppleLocale -string ja_JP

      - name: Run all unit tests and build Release
        run: bash Tools/ci.sh

      - name: Build signed Universal app and notarize
        env:
          RELEASE_OUTPUT_DIR: ${{ runner.temp }}/release-output
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: bash Tools/build-release.sh

      - name: Create or update draft release
        env:
          RELEASE_OUTPUT_DIR: ${{ runner.temp }}/release-output
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash Tools/publish-release.sh

      - name: Retain notarization diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: notarization-${{ github.run_number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-output/notarization-*.json
          if-no-files-found: ignore
          retention-days: 7
